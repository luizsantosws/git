<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Artspectro</title>
  <meta name="theme-color" content="#000000">
  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-TileImage" content="assets/mstile-144x144.png">
  <link rel="mask-icon" href="safari-pinned-tab.svg" color="#ffffff">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="assets/favicon-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <link rel="canonical" href="https://www.artspectro.com.br/" />
  
  <style>
    html, body { 
      height: 100%; 
      margin: 0; 
      background: #020202; /* Fundo levemente mais escuro para o plasma contrastar */
    }
    
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      perspective: 1200px;
    }

    /* Container Principal */
    .art-logo-container {
      position: relative;
      display: block;
      border-radius: 20px;
      cursor: pointer;
      transform-style: preserve-3d;
      
      transform: 
        rotateX(calc(var(--rx, 0deg))) 
        rotateY(calc(var(--ry, 0deg))) 
        scale3d(var(--sc, 1), var(--sc, 1), var(--sc, 1));
      
      /* Sombra projetada ganha um tom sutil do plasma ao se mover */
      box-shadow: 
        calc(var(--ry, 0deg) * -1.5) 
        calc(var(--rx, 0deg) * 1.5) 
        var(--sh-blur, 30px) 
        rgba(0, 0, 0, var(--sh-op, 0.6)),
        0 0 40px -10px rgba(138, 43, 226, calc(var(--sh-op, 0.5) * 0.3)), /* Brilho de plasma vazando por trás */
        0 0 0 1px rgba(255, 255, 255, 0.08);

      transition: 
        transform 0.25s cubic-bezier(0.25, 0.8, 0.25, 1),
        box-shadow 0.25s cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    .art-logo-container:hover {
      --sc: 1.04; 
      --sh-blur: 60px; 
      --sh-op: 0.85; 
      transition: 
        transform 0.1s cubic-bezier(0.1, 0.5, 0.1, 1),
        box-shadow 0.1s cubic-bezier(0.1, 0.5, 0.1, 1);
    }

    /* Imagem da logo */
    img {
      width: min(70vmin, 90vw);
      height: auto;
      display: block;
      border-radius: 20px;
      pointer-events: none;
      transform: translateZ(15px); /* Logo ganha mais profundidade física */
    }

    /* Camada de Plasma Elegante */
    .art-shine {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
      border-radius: inherit;
      opacity: 0;
      mix-blend-mode: color-dodge; /* Permite que as cores do plasma se fundam de forma mágica com a imagem */
      
      transition: opacity 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      
      /* Gradiente de plasma multi-cores (Espectro Violeta, Azul e Magenta Neon) */
      background: 
        radial-gradient(
          350px circle at var(--mx, 50%) var(--my, 50%),
          rgba(255, 255, 255, 0.28) 0%,      /* Centro super brilhante e quente */
          rgba(138, 43, 226, 0.25) 25%,     /* Roxo elétrico médio */
          rgba(0, 191, 255, 0.18) 50%,       /* Azul ciano suave */
          rgba(255, 0, 128, 0.1) 75%,        /* Rastro magenta sutil nas bordas */
          transparent 100%
        );
    }

    /* Segunda camada de plasma para dar profundidade de "fluidez líquida" */
    .art-plasma-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 3;
      border-radius: inherit;
      opacity: 0;
      mix-blend-mode: screen;
      transition: opacity 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      
      /* Um gradiente ligeiramente defasado e mais amplo que se move com o mouse criando o rastro de plasma */
      background: radial-gradient(
        500px circle at var(--mx, 50%) var(--my, 50%),
        rgba(147, 51, 234, 0.12) 0%,
        rgba(59, 130, 246, 0.08) 45%,
        transparent 70%
      );
    }

    .art-logo-container:hover .art-shine,
    .art-logo-container:hover .art-plasma-overlay {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="art-logo-container" id="interactive-logo">
    <div class="art-shine"></div>
    <div class="art-plasma-overlay"></div>
    <img src="assets/logo.png" alt="Marca Artspectro">
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('interactive-logo');

      container.addEventListener('mousemove', (e) => {
        const rect = container.getBoundingClientRect();
        
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;
        
        container.style.setProperty('--mx', `${x}px`);
        container.style.setProperty('--my', `${y}px`);
        
        const percentX = (x / rect.width) - 0.5;
        const percentY = (y / rect.height) - 0.5;
        
        const maxAngle = 14; 
        const rotateX = (percentY * -maxAngle).toFixed(2);
        const rotateY = (percentX * maxAngle).toFixed(2);
        
        container.style.setProperty('--rx', `${rotateX}deg`);
        container.style.setProperty('--ry', `${rotateY}deg`);
      });

      container.addEventListener('mouseleave', () => {
        container.style.removeProperty('--rx');
        container.style.removeProperty('--ry');
        container.style.removeProperty('--sc');
        container.style.removeProperty('--sh-blur');
        container.style.removeProperty('--sh-op');
      });
    });
  </script>
</body>
</html>
